name: Deploy to cPanel via FTP
on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      
    - name: 🔄 Trigger cPanel Restart
      run: |
        mkdir -p UIAP-cloud-main/UIAP-cloud-main/tmp
        date > UIAP-cloud-main/UIAP-cloud-main/tmp/restart.txt
    
    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./ # Changed from /uiap-cloud/ to match the FTP account's root path
